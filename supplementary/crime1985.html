<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%234f46e5'/%3E%3Crect x='22' y='52' width='14' height='26' rx='3' fill='%23a5b4fc'/%3E%3Crect x='43' y='36' width='14' height='42' rx='3' fill='%23e0e7ff'/%3E%3Crect x='64' y='22' width='14' height='56' rx='3' fill='%23ffffff'/%3E%3C/svg%3E" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国石油大学（华东）2025新生</title>
    <script src="../assets/d3.v7.min.js"></script>
    <script src="utils/data.js"></script>
    <!-- <script src="../assets/d3-regression.min.js"></script> -->
    <script src="utils/scatter.js"></script>
    <link rel="stylesheet" href="style/scatter.css">
</head>

<body>
    <div class="chart-container">
        <h2>1985年美国犯罪数据性别差异比例（从大到小排序）</h2>
        <div id="chart"></div>
    </div>
</body>
<script>
    // 启动渲染
    main();
    // 测试树渲染
    async function main() {
        try {
            const data = await await d3.csv("data/1985CrimeGender.csv", function (d) {//本质上是在定义一个函数,d为参数
                return { crimeType:d.犯罪类型, male: +d.男性, female: +d.女性};
            });
            data.forEach(rec => {
                rec.genderDiffRatio = (rec.male-rec.female)/(rec.male+rec.female);
            });
            data.sort((a, b) => b.genderDiffRatio - a.genderDiffRatio);//排序
            renderScatter(data,"#chart");
        } catch (error) {
            console.error("渲染失败:", error);
            d3.select("#tree-container").html(`<div style="color:red">加载失败: ${error.message}</div>`);
        }
    }

</script>

</html>
